name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format with Ruff
        run: uv run ruff format .

      - name: Apply Ruff fixes
        run: uv run ruff check --fix .

      - name: Verify lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Commit Ruff changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "style: apply Ruff automatic fixes"
          git push
          
  hermes-baseline:
    name: Hermes baseline contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate launch script
        run: bash -n scripts/hermes-emuru.sh
      - name: Validate configuration contract
        run: python3 scripts/hermes_baseline.py
      - name: Validate recorded runtime identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          record = json.loads(Path("infra/hermes/runtime-lock.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", record.get("commit", "")):
              raise SystemExit("Invalid Hermes commit")
          if not re.fullmatch(r"[0-9a-f]{64}", record.get("installer_sha256", "")):
              raise SystemExit("Invalid installer checksum")
          if record.get("provider") != "gemini":
              raise SystemExit("Unexpected provider")
          if record.get("model") != "gemini-3.8-flash":
              raise SystemExit("Unexpected model")
          print("Runtime identity: PASS")
          PY