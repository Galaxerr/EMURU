name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format with Ruff
        run: uv run --frozen ruff format --check .

      - name: Verify lint
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen pytest -q

  hermes-baseline:
    name: Hermes baseline contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Validate launch script
        run: bash -n scripts/hermes/emuru.sh
      - name: Validate Telegram launcher
        run: bash -n scripts/hermes/telegram.sh
      - name: Validate on-demand operation scripts
        run: |
          bash -n scripts/service/wake.sh
          bash -n scripts/service/sleep.sh
          bash -n scripts/service/status.sh
      - name: Validate Telegram contract offline
        run: uv run --frozen python scripts/hermes/telegram.py --offline
      - name: Validate configuration contract
        run: python3 scripts/hermes/baseline.py
      - name: Validate selected model route
        run: uv run --frozen python scripts/hermes/vault-profile.py --offline
      - name: Validate recorded runtime identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          record = json.loads(Path("infra/hermes/runtime-lock.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", record.get("commit", "")):
              raise SystemExit("Invalid Hermes commit")
          if not re.fullmatch(r"[0-9a-f]{64}", record.get("installer_sha256", "")):
              raise SystemExit("Invalid installer checksum")
          dockerfile = Path("Dockerfile").read_text()
          if f"git fetch --depth=1 origin {record['commit']} " not in dockerfile:
              raise SystemExit("Docker Hermes commit differs from runtime lock")
          pins = json.loads(Path("infra/docker/deployment-lock.json").read_text())
          for name in ("python", "uv"):
              if pins[name] not in dockerfile:
                  raise SystemExit(f"Docker {name} identity differs from deployment lock")
          print("Runtime identity: PASS")
          PY

  container-foundation:
    name: Disposable bounded gateway contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Deterministic qualification fixture
        run: uv run --frozen python scripts/hermes/qualify.py --fixture
      - name: Compose validation with disposable secrets
        run: uv run --frozen python scripts/hermes/container-check.py --config-only
      - name: Fetch pinned infrastructure
        run: |
          docker image inspect ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839 >/dev/null 2>&1 || docker pull ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
          docker image inspect ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687 >/dev/null 2>&1 || docker pull ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687
      - name: Build application and pinned native runtime
        run: |
          uv run --frozen python - <<'PYTHON'
          import os
          import runpy
          module = runpy.run_path("scripts/hermes/container.py")
          _, image = module["ensure_image"]()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"EMURU_TEST_IMAGE={image}\n")
          PYTHON
      - name: Native contracts, lifecycle and Docker rollback
        run: uv run --frozen python scripts/hermes/container-check.py
