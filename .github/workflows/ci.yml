name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned infrastructure images, defined once. Inherited by the composite actions.
  LITELLM_IMAGE: ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
  OLLAMA_IMAGE: ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks
  # ---------------------------------------------------------------------------
  quality:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .

  # Merges the former hermes-baseline, hermes-offline, qualification and
  # container-config jobs: each was seconds of work behind a full runner startup.
  contracts:
    name: Static and offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env

      - name: Validate shell scripts
        run: |
          bash -n scripts/hermes/emuru.sh
          bash -n scripts/hermes/telegram.sh
          bash -n scripts/service/wake.sh
          bash -n scripts/service/sleep.sh
          bash -n scripts/service/status.sh

      - name: Validate configuration contract
        run: python3 scripts/hermes/baseline.py

      - name: Validate recorded runtime identity
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          record = json.loads(Path("infra/hermes/runtime-lock.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", record.get("commit", "")):
              raise SystemExit("Invalid Hermes commit")
          if not re.fullmatch(r"[0-9a-f]{64}", record.get("installer_sha256", "")):
              raise SystemExit("Invalid installer checksum")
          dockerfile = Path("Dockerfile").read_text()
          if f"git fetch --depth=1 origin {record['commit']} " not in dockerfile:
              raise SystemExit("Docker Hermes commit differs from runtime lock")
          pins = json.loads(Path("infra/docker/deployment-lock.json").read_text())
          for name in ("python", "uv"):
              if pins[name] not in dockerfile:
                  raise SystemExit(f"Docker {name} identity differs from deployment lock")
          print("Runtime identity: PASS")
          PY

      - name: Validate Telegram contract offline
        run: uv run --frozen python scripts/hermes/telegram.py --offline

      - name: Validate selected model route
        run: uv run --frozen python scripts/hermes/vault-profile.py --offline

      - name: Deterministic qualification fixture
        run: uv run --frozen python scripts/hermes/qualify.py --fixture

      - name: Compose validation with disposable secrets
        run: uv run --frozen python scripts/hermes/container-check.py --config-only

  # ---------------------------------------------------------------------------
  # Shared acceptance image (built once, consumed by the jobs below)
  # ---------------------------------------------------------------------------
  container-build:
    name: Build shared acceptance image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env

      - name: Build application and pinned native runtime
        run: |
          uv run --frozen python - <<'PYTHON'
          import os
          import runpy
          module = runpy.run_path("scripts/hermes/container.py")
          source, image = module["ensure_image"]()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"EMURU_IMAGE_TAG=emuru:local-{source}\n")
          PYTHON

      # zstd is much faster than gzip for both save and load.
      - name: Export verified image
        run: docker save "$EMURU_IMAGE_TAG" | zstd -T0 -3 -o "$RUNNER_TEMP/emuru-image.tar.zst"

      # act 0.2.89 supports the v4 artifact protocol.
      - uses: actions/upload-artifact@v4
        with:
          name: emuru-acceptance-image
          path: ${{ runner.temp }}/emuru-image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Acceptance jobs (all run in parallel once the image exists)
  # ---------------------------------------------------------------------------
  container-native:
    name: Native container contracts
    needs: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROFILES: agent
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/load-acceptance-image
      - run: uv run --frozen python -c 'import runpy; runpy.run_path("scripts/hermes/container-check.py")["verify"]()'

  # The former single 8-step job, split so each check gets its own runner,
  # Docker daemon and .runtime directory. Deterministic verdicts prove mechanics;
  # provider usefulness is qualified separately.
  container-foundation:
    name: Gateway contract (${{ matrix.check }})
    needs: container-build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check == 'rework-matrix' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: coder-confinement
            cmd: scripts/hermes/coder-check.py --image "$EMURU_TEST_IMAGE" --native-self-check --sandbox-self-check --isolation-probes
          - check: reviewer
            cmd: scripts/hermes/reviewer-check.py --image "$EMURU_TEST_IMAGE"
          - check: coder-lifecycle
            cmd: scripts/hermes/coder-lifecycle-check.py --image "$EMURU_TEST_IMAGE" --supervised
          - check: reviewer-supervised
            cmd: scripts/hermes/reviewer-check.py --image "$EMURU_TEST_IMAGE" --supervised
          - check: rework-supervised
            cmd: scripts/hermes/rework-check.py --image "$EMURU_TEST_IMAGE" --supervised
          - check: wake-supervised
            cmd: scripts/hermes/wake-check.py --image "$EMURU_TEST_IMAGE" --supervised
          - check: rework-matrix
            cmd: "- < scripts/ci/rework-matrix.py"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-install-dir: ${{ runner.temp }}/coder-python
      - uses: ./.github/actions/load-acceptance-image
      - name: Run ${{ matrix.check }}
        run: bash scripts/ci/as-coder.sh ${{ matrix.cmd }}

  lifecycle-acceptance:
    name: Wake, update and rollback
    needs: container-native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROFILES: agent
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/load-acceptance-image
      - run: uv run --frozen python -c 'import runpy; runpy.run_path("scripts/hermes/wake-check.py")["verify"](native_checked=True)'

  scout-acceptance:
    name: Isolated read-only scout acceptance
    needs: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-install-dir: ${{ runner.temp }}/scout-python
      - uses: ./.github/actions/load-acceptance-image
        with:
          pull-infra: "false"
      - run: bash scripts/ci/as-coder.sh scripts/hermes/scout-check.py
