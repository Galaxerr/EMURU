name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format with Ruff
        run: uv run ruff format --check .

      - name: Verify lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  hermes-baseline:
    name: Hermes baseline contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Validate launch script
        run: bash -n scripts/hermes/emuru.sh
      - name: Validate Telegram launcher
        run: bash -n scripts/hermes/telegram.sh
      - name: Validate on-demand operation scripts
        run: |
          bash -n scripts/service/wake.sh
          bash -n scripts/service/sleep.sh
          bash -n scripts/service/status.sh
      - name: Validate Telegram contract offline
        run: uv run --frozen python scripts/hermes/telegram.py --offline
      - name: Test Telegram admission and restart reliability
        run: >-
          uv run --frozen pytest -q
          tests/telegram/test_telegram_queue.py
          tests/telegram/test_telegram_runtime.py
          tests/telegram/test_hermes_telegram_profile.py
          tests/telegram/test_telegram_vault_integration.py
          tests/telegram/test_telegram_launcher.py
      - name: Validate configuration contract
        run: python3 scripts/hermes/baseline.py
      - name: Test vault integration over stdio
        run: uv run --frozen pytest -q tests/test_hermes_vault_integration.py tests/test_hermes_vault_profile.py tests/test_openai.py tests/test_gemini.py tests/test_ollama.py tests/test_ollama_profile.py tests/test_ollama_local.py tests/test_ollama_selection.py tests/test_ollama_integration.py
      - name: Validate selected model route
        run: uv run --frozen python scripts/hermes/vault-profile.py --offline
      - name: Test private vault target and synthetic isolation
        run: uv run --frozen pytest -q tests/test_vault_target.py
      - name: Validate recorded runtime identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          record = json.loads(Path("infra/hermes/runtime-lock.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", record.get("commit", "")):
              raise SystemExit("Invalid Hermes commit")
          if not re.fullmatch(r"[0-9a-f]{64}", record.get("installer_sha256", "")):
              raise SystemExit("Invalid installer checksum")
          if record.get("provider") != "gemini":
              raise SystemExit("Unexpected provider")
          if record.get("model") != "gemini-3.8-flash":
              raise SystemExit("Unexpected model")
          print("Runtime identity: PASS")
          PY

  container-foundation:
    name: Disposable bounded gateway contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Gateway routing and profile policy
        run: uv run --frozen pytest -q tests/test_gateway_integration.py tests/test_ollama_selection.py tests/test_hermes_profile_adapters.py
      - name: Compose validation with disposable secrets
        run: uv run --frozen python scripts/hermes/container-check.py --config-only
      - name: Fetch pinned infrastructure
        run: |
          docker pull ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
          docker pull ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687
      - name: Build application and pinned native runtime
        run: docker build -t emuru:latest .
      - name: Native MCP, auth, tools and persistent receipts
        run: uv run --frozen python scripts/hermes/container-check.py
