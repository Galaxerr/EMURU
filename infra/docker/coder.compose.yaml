name: emuru-coder-qualification
services:
  check:
    profiles: [coder-qualification]
    image: emuru:latest
    user: "1000:1000"
    entrypoint: [/usr/bin/timeout, --signal=KILL, "60"]
    command: [/opt/emuru/.venv/bin/python, -I, -B, -c, "import sys; sys.path.insert(0, '/opt/emuru/src'); from emuru.projects.coder_sandbox import candidate_main; candidate_main()"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 536870912
    cpus: 1
    restart: "no"
    stop_grace_period: 1s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,nr_inodes=1024,mode=1777
      - /dev/shm:ro,noexec,nosuid,nodev,size=1m
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: []
    logging: {driver: none}
